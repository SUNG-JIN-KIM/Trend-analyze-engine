spring:
  application:
    name: trend-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/trend_agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  mail:
    host: "${MAIL_HOST:}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: "${MAIL_SMTP_AUTH:true}"
          starttls:
            enable: "${MAIL_SMTP_STARTTLS_ENABLE:true}"
            required: "${MAIL_SMTP_STARTTLS_REQUIRED:false}"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID:google-client-id-not-configured}"
            client-secret: "${GOOGLE_CLIENT_SECRET:google-client-secret-not-configured}"
            scope:
              - email
              - profile
          kakao:
            client-id: "${KAKAO_CLIENT_ID:}"
            client-secret: "${KAKAO_CLIENT_SECRET:}"
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          naver:
            client-id: "${NAVER_CLIENT_ID:naver-client-id-not-configured}"
            client-secret: "${NAVER_CLIENT_SECRET:naver-client-secret-not-configured}"
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# 서비스 런타임 LLM 설정 (GEMMA4 E2B).
# 기본값은 Ollama 기준이며, LM Studio 사용 시 base-url 만 http://localhost:1234/v1 로 변경하면 된다.
# Anthropic / Claude API 는 사용하지 않는다.
llm:
  base-url: "${LLM_BASE_URL:http://localhost:11434/v1}"
  model: "${LLM_MODEL:gemma4:e2b}"
  timeout-ms: "${LLM_TIMEOUT_MS:30000}"
  temperature: "${LLM_TEMPERATURE:0.2}"

# 기본 JWT 인증 설정.
# 운영 환경에서는 AUTH_JWT_SECRET을 충분히 긴 임의 문자열로 반드시 교체한다.
auth:
  jwt-secret: "${AUTH_JWT_SECRET:local-dev-secret-change-me}"
  jwt-expiration-ms: "${AUTH_JWT_EXPIRATION_MS:86400000}"
  phone:
    code-expiration-minutes: "${AUTH_PHONE_CODE_EXPIRATION_MINUTES:5}"
    resend-cooldown-seconds: "${AUTH_PHONE_RESEND_COOLDOWN_SECONDS:60}"
    max-attempts: "${AUTH_PHONE_MAX_ATTEMPTS:5}"
    max-resend-count: "${AUTH_PHONE_MAX_RESEND_COUNT:5}"
    daily-request-limit: "${AUTH_PHONE_DAILY_REQUEST_LIMIT:5}"

sms:
  # 실제 문자 발송을 기본으로 한다. 로컬 로그 출력만 원하면 local 프로필 또는 SMS_PROVIDER=mock을 명시한다.
  provider: "${SMS_PROVIDER:naver-sens}"
  api-key: "${SMS_API_KEY:}"
  api-secret: "${SMS_API_SECRET:}"
  service-id: "${SMS_SERVICE_ID:}"
  from-number: "${SMS_FROM_NUMBER:}"
  base-url: "${SMS_BASE_URL:https://sens.apigw.ntruss.com}"

app:
  frontend-url: "${APP_FRONTEND_URL:http://localhost:5173}"
  admin:
    approval-email: "${ADMIN_APPROVAL_EMAIL:ksjcloud98@gmail.com}"
    owner-email: "${ADMIN_OWNER_EMAIL:}"
    approval-token-expire-minutes: "${ADMIN_APPROVAL_TOKEN_EXPIRE_MINUTES:1440}"
    approval-link-base-url: "${ADMIN_APPROVAL_LINK_BASE_URL:http://localhost:8080}"
    mail:
      enabled: "${ADMIN_MAIL_ENABLED:false}"
      from: "${ADMIN_MAIL_FROM:}"

# Steam 공개 리뷰 조회 설정.
# API Key 없이 store.steampowered.com/appreviews/{appId} 공개 엔드포인트를 사용한다.
steam:
  base-url: "${STEAM_BASE_URL:https://store.steampowered.com}"
  timeout-ms: "${STEAM_TIMEOUT_MS:10000}"
  api-key: "${STEAM_API_KEY:}"

# 라이브 트렌드 자동 갱신 설정.
# 외부 라이브 플랫폼 데이터는 사용자 요청마다 조회하지 않고, 스케줄러가 snapshot 으로 갱신한다.
live-trends:
  scheduler-enabled: "${LIVE_TRENDS_SCHEDULER_ENABLED:true}"
  refresh-interval-ms: "${LIVE_TRENDS_REFRESH_INTERVAL_MS:1800000}"
  refresh-on-startup: "${LIVE_TRENDS_REFRESH_ON_STARTUP:false}"
  expose-fallback-data: "${LIVE_TRENDS_EXPOSE_FALLBACK_DATA:false}"
  platforms:
    twitch:
      client-id: "${TWITCH_CLIENT_ID:}"
      client-secret: "${TWITCH_CLIENT_SECRET:}"
      access-token: "${TWITCH_ACCESS_TOKEN:}"
      api-key: "${TWITCH_API_KEY:}"
      api-base-url: "${TWITCH_API_BASE_URL:https://api.twitch.tv}"
    chzzk:
      client-id: "${CHZZK_CLIENT_ID:}"
      client-secret: "${CHZZK_CLIENT_SECRET:}"
      access-token: "${CHZZK_ACCESS_TOKEN:}"
      refresh-token: "${CHZZK_REFRESH_TOKEN:}"
      api-base-url: "${CHZZK_API_BASE_URL:https://openapi.chzzk.naver.com}"
      redirect-uri: "${CHZZK_REDIRECT_URI:http://localhost:8080/api/chzzk/oauth/callback}"
      api-key: "${CHZZK_API_KEY:}"
    soop:
      client-id: "${SOOP_CLIENT_ID:}"
      client-secret: "${SOOP_CLIENT_SECRET:}"
      access-token: "${SOOP_ACCESS_TOKEN:}"
      refresh-token: "${SOOP_REFRESH_TOKEN:}"
      api-base-url: "${SOOP_API_BASE_URL:}"
      redirect-uri: "${SOOP_REDIRECT_URI:http://localhost:8080/api/soop/oauth/callback}"
      api-key: "${SOOP_API_KEY:}"
    steam:
      use-public-api: "${STEAM_USE_PUBLIC_API:true}"
      api-key: "${STEAM_API_KEY:}"
